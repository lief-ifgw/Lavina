<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Gerador de Frequências</title>
        <script src="../../components/load-mathjax.js" async></script>
        <link rel="icon" type="image/x-icon" href="../../img/logo_LIEF.png">
        <link rel="stylesheet" type="text/css" href="../../styles/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <meta charset="utf-8" />
    </head>

    <body>
        <nav>
            <img src="../../img/logo_LIEF.png" alt="LIEF physlets" height="75" width="75" id="nav_logo">
            <ul>
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../../pages/experimentos.html">Experimentos</a></li>
                <li><a href="../../pages/projetos.html">Projetos</a></li>

            </ul>
        </nav>

        <div class="content" style="position: flex">
            <h1>Gerador de Frequência</h1>

            Crie ondas e escute o som.

            <div class="simulation">
                <div class="control-panel">
                    <div class="slidecontainer">
                        <table>
                            <tr>
                                <td colspan="3">Volume: </td>
                                <td colspan="3"><input type="range" min="1.0" max="30.0" value="10.0" step="1.0" class="slider" id="m1"></td>
                            </tr>

                        </table>
                    </div>
                </div>
                <canvas id="waveCanvas" class="myCanvas" align="center" ></canvas>
            </div>
            <div class="control-panel">
                Frequência:
                <table>
                    <tr>
                        <td style="display: flex;"><input type="range" min="1.0" max="30.0" value="10.0" step="1" class="slider" id="freq"></td>
                    </tr>

            </div>

        </div>
        <script src="../../utils/ball.js"></script>
        <script src="../../utils/wall.js"></script>
        <script src="../../utils/vector2D.js"></script>
        <script src="../../utils/graph.js"></script>
        <script src="../../utils/arrow.js"></script>
        <script src="src/script.js"></script>
    </body>
</html>
